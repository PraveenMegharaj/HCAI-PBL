{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    {% block extra_css %}{% endblock %}
    <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}">
    <title>{% block title %}HCAI Project Hub{% endblock %}</title>
</head>
<body>
    <nav class="topnav">
        <a href="{% url 'home:index' %}" class="brand">
            <span class="brand-mark"></span>
            HCAI
            <span class="brand-sub">Project Hub</span>
        </a>
        <div class="nav-links">
            <a href="{% url 'home:index' %}"     {% if request.resolver_match.namespace == 'home' %}class="active"{% endif %}>Home</a>
            <a href="{% url 'project1:index' %}" {% if request.resolver_match.namespace == 'project1' %}class="active"{% endif %}>Project 1</a>
            <a href="{% url 'project2:index' %}" {% if request.resolver_match.namespace == 'project2' %}class="active"{% endif %}>Project 2</a>
            <a href="{% url 'project3:index' %}" {% if request.resolver_match.namespace == 'project3' %}class="active"{% endif %}>Project 3</a>
            <a href="{% url 'project4:index' %}" {% if request.resolver_match.namespace == 'project4' %}class="active"{% endif %}>Project 4</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block script %}{% endblock script %}
</body>
</html>
